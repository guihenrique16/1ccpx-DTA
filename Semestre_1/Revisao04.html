<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        let dados = [8, 15, 30, 27, 12];
        let procurado = 30;
        let posicao = -1;

        for (let i = 0; i < dados.length; i++) {
            if (dados[i] === procurado) {
                posicao = i;
                break;
            }

        };
        if (posicao == -1){ 
            console.log('Elemento ' + procurado + ' nao encontrado');

        } else {
            console.log('Elemento ' + procurado + ' encontrado na posicao ' + posicao);

        }

    </script>
</head>

</body>

</html>
