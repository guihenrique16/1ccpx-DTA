<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Lista Encadeada Simples</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        input {
            padding: 12px;
            width: 250px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background-color: #4CAF50;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.03);
        }

        #saida {
            margin-top: 25px;
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            width: 70%;
            margin-left: auto;
            margin-right: auto;
            font-size: 18px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
            min-height: 30px;
        }
    </style>
</head>

<body>

    <h1>Lista Encadeada (versão simples)</h1>

    <input type="text" id="nome" placeholder="Digite um nome">
    <br>

    <button onclick="adicionarFim()">Adicionar no fim</button>

    <button onclick="adicionarInicio()">Adicionar no começo</button>

    <button onclick="removerElemento()">Remover elemento</button>

    <button onclick="buscarElemento()">Buscar elemento</button>

    <button onclick="mostrar()">Mostrar Lista</button>

    <div id="saida"></div>

    <script>


        let valores = [];
        let proximo = [];

        let inicio = -1;
        let ultimo = -1;


        function adicionarFim() {

            let nome = document.getElementById("nome").value;

            if (nome === "") {
                alert("Digite um nome");
                return;
            }

            let novoIndice = valores.length;

            valores.push(nome);
            proximo.push(-1);

            if (inicio === -1) {

                inicio = novoIndice;
                ultimo = novoIndice;

            } else {

                proximo[ultimo] = novoIndice;
                ultimo = novoIndice;
            }



            mostrar();

            document.getElementById("nome").value = "";
        }


        function adicionarInicio() {

            let nome = document.getElementById("nome").value;

            if (nome === "") {
                alert("Digite um nome");
                return;
            }

            let novoIndice = valores.length;

            valores.push(nome);

            proximo.push(inicio);

            inicio = novoIndice;

            if (ultimo === -1) {
                ultimo = novoIndice;
            }



            mostrar();

            document.getElementById("nome").value = "";
        }

        function removerElemento() {

            let nome = document.getElementById("nome").value;

            if (nome === "") {
                alert("Digite um nome");
                return;
            }

            let atual = inicio;
            let anterior = -1;

            while (atual !== -1 && valores[atual] !== nome) {

                anterior = atual;
                atual = proximo[atual];
            }


            if (atual === -1) {

                alert("Nome não encontrado na Lista");
                return;
            }


            if (anterior === -1) {

                inicio = proximo[atual];

            } else {

                proximo[anterior] = proximo[atual];
            }


            if (atual === ultimo) {
                ultimo = anterior;
            }

            alert("Elemento removido da lista!");

            mostrar();

            document.getElementById("nome").value = "";
        }


        function buscarElemento() {

            let nome = document.getElementById("nome").value;

            if (nome === "") {
                alert("Digite um nome");
                return;
            }

            let atual = inicio;
            let encontrado = false;

            while (atual !== -1) {

                if (valores[atual] === nome) {
                    encontrado = true;
                    break;
                }

                atual = proximo[atual];
            }

            if (encontrado) {



                document.getElementById("saida").innerHTML =
                    "Elemento encontrado: " + nome;

            } else {



                document.getElementById("saida").innerHTML =
                    "Elemento não encontrado.";
            }

            document.getElementById("nome").value = "";
        }


        function mostrar() {

            let resultado = "";
            let atual = inicio;

            while (atual !== -1) {

                resultado += valores[atual] + " → ";
                atual = proximo[atual];
            }

            if (inicio === -1) {

                resultado = "Lista vazia";

            } else {

                resultado += "null";
            }

            document.getElementById("saida").innerHTML = resultado;
        }

    </script>

</body>

</html>
